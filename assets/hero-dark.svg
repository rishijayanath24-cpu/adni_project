<svg xmlns="http://www.w3.org/2000/svg" width="960" height="392" viewBox="0 0 960 392" role="img" aria-labelledby="t d">
<title id="t">Sequential modality acquisition on ADNI</title>
<desc id="d">Scatter of acquisition policies by cost and AUC. Published policies (UMoS, ProMUSE, DQN) do not beat fixed or random rules. An MRI-only model with richer features reaches AUC 0.882 at cost 1.0 against 0.894 for all four modalities at cost 9.5.</desc>
